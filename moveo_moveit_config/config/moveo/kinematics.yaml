# Kinematics configuration for the Moveo robot. This file specifies the kinematics solver and its parameters for the robot's arm.
arm:
  kinematics_solver: kdl_kinematics_plugin/KDLKinematicsPlugin
  position_only_ik: true
  kinematics_solver_attempts: 5
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1

mobile_base_manipulator:
  kinematics_solver: stretch_kinematics_plugin/StretchKinematicsPlugin
  kinematics_solver_search_resolution: 0.005
  kinematics_solver_timeout: 0.1