moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - arm_controller

  arm_controller:
    type: FollowJointTrajectory
    action_ns: arm_controller/follow_joint_trajectory
    default: true
    joints:
      - base_rotation_joint
      - shoulder_joint
      - elbow_joint
      - wrist_joint
      - wrist_roll_joint
      - wrist_yaw_joint
