slam_toolbox:
  ros__parameters:

    # Frames
    map_frame: map
    odom_frame: odom
    base_frame: ebot_base_link
    scan_topic: scan_filtered

    # Mode
    mode: localization
    map_file_name: /home/ebot/EBOT_TEST/map/office_map5
# /home/ebot/EBOT_TEST/map/office_map5.pgm

    # Timing
    transform_timeout: 0.2
    throttle_scans: 1
    minimum_time_interval: 0.05

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: false
    scan_barycenter_max_distance: 0.5

    # Motion assumptions
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.02

    # Map resolution
    resolution: 0.05

    # Loop closure
    do_loop_closing: false
    loop_search_maximum_distance: 3.0

    # Debug safety
    debug_logging: false
