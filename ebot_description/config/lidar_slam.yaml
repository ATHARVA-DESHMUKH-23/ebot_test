slam_toolbox:
  ros__parameters:

    # Frames
    map_frame: map
    odom_frame: odom
    base_frame: ebot_base_link
    scan_topic: scan

    # Mode
    mode: localization
    map_file_name: /home/rajvardhan/mobile_manipulator/map/office_map4.yaml


    # Timing
    transform_timeout: 0.2
    throttle_scans: 1
    minimum_time_interval: 0.05

    # Scan matching
    use_scan_matching: true
    use_scan_barycenter: true

    # Motion assumptions
    minimum_travel_distance: 0.05
    minimum_travel_heading: 0.02

    # Map resolution
    resolution: 0.05

    # Loop closure
    do_loop_closing: true
    loop_search_maximum_distance: 3.0

    # Debug safety
    debug_logging: false
