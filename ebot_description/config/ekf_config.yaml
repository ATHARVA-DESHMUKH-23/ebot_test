ekf_filter_node:
  ros__parameters:

    frequency: 50.0
    sensor_timeout: 0.1
    two_d_mode: true

    map_frame: map
    odom_frame: odom
    base_link_frame: ebot_base_link
    world_frame: odom

    publish_tf: true

        # --------------------
    # LIDAR ODOMETRY (RF2O)
    # --------------------
    odom1: /odom_rf2o
    odom1_config: [
      true,  true,  false,   # x y z (pose)
      false, false, true,    # roll pitch yaw
      false, false, false,   # vx vy vz
      false, false, false,   # wx wy wz
      false, false, false
    ]

    odom1_differential: false
    odom1_relative: false


    # --------------------
    # ODOMETRY (ENCODERS)
    # --------------------
    odom0: /odom
    odom0_config: [
      false, false, false,   # x y z (pose)
      false, false, false,   # roll pitch yaw
      true,  false, false,   # vx vy vz
      false, false, true,    # wx wy wz  (we will DOWNWEIGHT this)
      false, false, false
    ]

    odom0_differential: false
    odom0_relative: false

    # --------------------
    # IMU (MAG YAW)
    # --------------------
    imu0: /imu/data
    imu0_config: [
      false, false, false,   # x y z
      false, false, true,    # roll pitch yaw  <-- TRUST YAW
      false, false, false,   # vx vy vz
      false, false, false,   # wx wy wz
      false, false, false
    ]

    imu0_remove_gravitational_acceleration: true
